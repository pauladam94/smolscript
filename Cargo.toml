[workspace]
resolver = "3"
members = [
    "cst", # Concrete Syntax Tree
    "ast", # Abstract Syntax Tree
    "checker", # Type check of CST
    "interpreter", # Interpreter of AST
    "compiler", # Compiler of AST
    "tui", # Runner of AST
    "tests"
]

[profile.release]
# Automatically strip symbols from the binary.
strip = true
opt-level = "z" # Optimize for size.
# Enable link-time optimization
lto = true
codegen-units = 1
