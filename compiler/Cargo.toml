[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
# Lexer
logos = { version = "0.16.1", default-features = false, features = ["export_derive"] }
# Additional method useful with iterators
itertools = { version = "0.15.0", default-features = false }
# Annotation tools to have nice errors on code
annotate-snippets = { version = "0.12.16", default-features = false }
# Coloration string tool
# colored = { version = "3", default-features = false }
# Arena data structure
# id-arena = { version = "2.3.0", default-features = false}

[dev-dependencies]
colored = "3"
test_each_file = "0.3.7"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.140"
rand = "0.10.3"
